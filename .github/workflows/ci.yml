name: OVDB CI

on:
  push:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OV_DB/OVDBFrontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: OV_DB/OVDBFrontend
      - name: Build frontend
        run: npm run build
        working-directory: OV_DB/OVDBFrontend
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test (builds the whole solution, including OV_DB.Tests)
        run: dotnet test OVDB.sln -c Release --logger "trx;LogFileName=test-results.trx"
