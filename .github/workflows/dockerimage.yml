name: OVDB build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      # No secrets are baked into the image: the deployment supplies JWTSigningKey,
      # DBConnectionString, UserAgent and the bot tokens as runtime environment variables.
      run: docker build . --file Dockerfile --tag jjasloot/ovdb:$(date +%Y%m%d) --tag jjasloot/ovdb:latest
    - name: Docker login
      run: echo "${{ secrets.DockerPassword }}" | docker login -u ${{ secrets.DockerUsername }} --password-stdin
    - name: Docker push
      run: docker push --all-tags jjasloot/ovdb
