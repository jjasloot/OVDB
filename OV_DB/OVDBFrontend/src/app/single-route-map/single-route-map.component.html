@if (!error) {
  <div #box class="container" style="display: flex;flex-direction: column;">
    @if (routeName) {
    <div class="map-title"><b>{{ routeName }}</b></div>
    }
    <div class="map-container" #mapContainer>
      <div class="map" leaflet (leafletMapReady)="locate($event)" [leafletOptions]="options" [leafletLayers]="layers" [leafletLayersControl]="leafletLayersControl" [leafletFitBounds]="bounds">
      </div>
      <div [ngClass]="{'loading':loading,'loading-indicator':true}">
        <mat-spinner></mat-spinner>
      </div>
    </div>
  </div>
}

@if (error) {
  <div>
    {{'ERRORS.GENERIC'|translate}}
  </div>
}
