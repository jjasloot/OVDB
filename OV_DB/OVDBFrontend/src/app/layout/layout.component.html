<div #box class="container" style="display: flex; flex-direction: column">
  <mat-toolbar color="primary">
    <div class="row">
      <h2 style="cursor: pointer" (click)="gotoHome()">OVDB</h2>

      @if (isLoggedIn) {
      <div class="icons">
        @if (isAdmin) {
        <button mat-icon-button [routerLink]="['/administrator']" routerLinkActive="active-link"
          [class.marker]="hasUnreadRequestsAdmin" [matTooltip]="'MENU.ADMINISTRATOR'|translate"
          [attr.aria-label]="'MENU.ADMINISTRATOR'|translate">
          <mat-icon>supervisor_account</mat-icon>
        </button>
        }
        <div class="mobile">
          <button mat-icon-button [routerLink]="['/requests']" routerLinkActive="active-link"
            [class.marker]="hasUnreadRequests" [matTooltip]="'MENU.REQUESTS'|translate"
            [attr.aria-label]="'MENU.REQUESTS'|translate">
            <mat-icon>forum</mat-icon>
          </button>
          <button mat-icon-button [routerLink]="['/']" routerLinkActive="active-link"
            [routerLinkActiveOptions]="{exact: true}" [matTooltip]="'MENU.MAPS'|translate"
            [attr.aria-label]="'MENU.MAPS'|translate">
            <mat-icon>map</mat-icon>
          </button>
          <button mat-icon-button [routerLink]="['/admin']" routerLinkActive="active-link"
            [matTooltip]="'MENU.DATA'|translate" [attr.aria-label]="'MENU.DATA'|translate">
            <mat-icon>backup</mat-icon>
          </button>
        </div>
        <div class="desktop">
          <button mat-button [routerLink]="['/requests']" routerLinkActive="active-link"
            [class.marker]="hasUnreadRequests">
            <mat-icon>forum</mat-icon>
            {{'MENU.REQUESTS'|translate}}
          </button>
          <button mat-button [routerLink]="['/']" routerLinkActive="active-link"
            [routerLinkActiveOptions]="{exact: true}">
            <mat-icon>map</mat-icon>
            {{'MENU.MAPS'|translate}}
          </button>
          <button mat-button [routerLink]="['/admin']" routerLinkActive="active-link">
            <mat-icon>backup</mat-icon>
            {{'MENU.DATA'|translate}}
          </button>
        </div>
        <button mat-button [matMenuTriggerFor]="menu">
          <mat-icon>menu</mat-icon>
          {{'MENU.MENU'|translate}}
        </button>
        <mat-menu #menu="matMenu">
          @if(currentLanguage!=='nl'){
          <button mat-menu-item (click)="setLanguage('nl')"><span class="flag">🇳🇱</span> Nederlands</button>
          }
          @if(currentLanguage!=='en'){
          <button mat-menu-item (click)="setLanguage('en')"><span class="flag">🇬🇧</span> English</button>
          }
          <button mat-menu-item (click)="toggleTheme()">
            <mat-icon>{{themeService.isDarkMode ? 'light_mode' : 'dark_mode'}}</mat-icon>
            {{themeService.isDarkMode ? ('MENU.LIGHT_MODE' | translate) : ('MENU.DARK_MODE' | translate)}}
          </button>
          <button mat-menu-item [routerLink]="['/images']">
            <mat-icon>image</mat-icon>
            {{ "HOME.IMAGES" | translate }}
          </button>
          <button mat-menu-item [routerLink]="['/stats']">
            <mat-icon>query_stats</mat-icon>
            {{ "HOME.STATS" | translate }}
          </button>
          <button mat-menu-item [routerLink]="['/profile']">
            <mat-icon>person</mat-icon>
            {{ "MENU.PROFILE" | translate }}
          </button>
          <button mat-menu-item [routerLink]="['/help']">
            <mat-icon>help_outline</mat-icon>
            {{'MENU.HELP'|translate}}
          </button>
          <button mat-menu-item (click)="signOut()">
            <mat-icon>highlight_off</mat-icon>
            <span> {{'MENU.SIGNOUT'|translate}}</span>
          </button>
        </mat-menu>

      </div>
      }
      @if (!isLoggedIn) {
      <div class="icons">
        <button mat-icon-button (click)="toggleTheme()"
          [matTooltip]="(themeService.isDarkMode ? 'MENU.LIGHT_MODE' : 'MENU.DARK_MODE') | translate"
          [attr.aria-label]="(themeService.isDarkMode ? 'MENU.LIGHT_MODE' : 'MENU.DARK_MODE') | translate">
          <mat-icon>{{themeService.isDarkMode ? 'light_mode' : 'dark_mode'}}</mat-icon>
        </button>
        <button mat-icon-button [routerLink]="['/help']" [matTooltip]="'MENU.HELP'|translate"
          [attr.aria-label]="'MENU.HELP'|translate">
          <mat-icon>help_outline</mat-icon>
        </button>
        @if(currentLanguage!=='nl'){
        <button mat-icon-button (click)="setLanguage('nl')" matTooltip="Nederlands" aria-label="Nederlands"><span
            class="flag">🇳🇱</span></button>
        }
        @if(currentLanguage!=='en'){
        <button mat-icon-button (click)="setLanguage('en')" matTooltip="English" aria-label="English"><span
            class="flag">🇬🇧</span></button>
        }
        <button mat-icon-button (click)="signIn()" [matTooltip]="'HOME.LOGIN'|translate"
          [attr.aria-label]="'HOME.LOGIN'|translate">
          <mat-icon>person</mat-icon>
        </button>
      </div>
      }
    </div>
  </mat-toolbar>
  <div class="router-container">
    <router-outlet></router-outlet>
  </div>
</div>
